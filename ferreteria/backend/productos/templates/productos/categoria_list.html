{% extends "productos/base.html" %}

{% block title %}Categorias{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Categorias</h1>
    <a href="{% url 'categoria_create' %}" class="btn btn-primary">+ Agregar categoria</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>Nombre</th>
        <th style="width: 220px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for categoria in categorias %}
        <tr>
          <td>{{ categoria.nombre }}</td>
          <td>
            <a href="{% url 'categoria_update' categoria.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
            <a href="{% url 'categoria_delete' categoria.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="5" class="text-center text-muted">No hay categorias registradas todavia.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
