<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería - Inicio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">🔧 Ferretería</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#productos">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header id="inicio" class="hero text-center text-white d-flex align-items-center">
    <div class="container">
      <h1 class="display-5 fw-bold">Todo para tu proyecto, en un solo lugar</h1>
      <p class="lead">Herramientas, materiales y más — catálogo conectado a nuestro backend en Django.</p>
    </div>
  </header>

  <main class="container my-5" id="productos">
    <h2 class="mb-4 text-center">Nuestros productos</h2>

    <div id="apiStatus" class="alert d-none" role="alert"></div>

    <div id="productosGrid" class="row g-4">
      <!-- Las tarjetas de producto se insertan aquí vía JS -->
    </div>
  </main>

  <footer id="contacto" class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">&copy; 2026 Ferretería. Proyecto de práctica (Django + Frontend responsivo).</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
